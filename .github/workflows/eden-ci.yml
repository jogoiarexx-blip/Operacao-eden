name: Operação Éden — QA e Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Validate production bundle
        run: npm run build:single
      - name: Check compiled HTML
        run: test -s dist-single/index.html
      - name: Install Chromium for playtest
        run: npx playwright install --with-deps chromium
      - name: End-to-end: Lia → Caio → K-1 → final
        run: |
          mkdir -p qa-shots
          npx vite preview --config vite.single.config.js --host 127.0.0.1 --port 4177 --strictPort > /tmp/eden-preview.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4177/ >/dev/null && break; sleep 1; done
          URL='http://127.0.0.1:4177/?debug=1' SHOT_DIR=qa-shots node scripts/e2e3.mjs
          URL='http://127.0.0.1:4177/?debug=1' SHOT_DIR=qa-shots node scripts/e2e-area-transitions.mjs
          URL='http://127.0.0.1:4177/?debug=1' SHOT_DIR=qa-shots node scripts/e2e-portals.mjs
      - name: Attach test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eden-qa-screenshots
          path: qa-shots/*.png
          if-no-files-found: ignore
