name: Operação Éden — QA e Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Validate production bundle
        run: npm run build:single
      - name: Check compiled HTML
        run: test -s dist-single/index.html
      - name: Install Chromium for playtest
        run: npx playwright install --with-deps chromium
      - name: "End-to-end: Lia → Caio → K-1 → final"
        run: |
          mkdir -p qa-shots
          npx vite preview --config vite.single.config.js --host 127.0.0.1 --port 4177 --strictPort > /tmp/eden-preview.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:4177/ >/dev/null && break; sleep 1; done
          URL='http://127.0.0.1:4177/?debug=1' SHOT_DIR=qa-shots node scripts/e2e-regina.mjs
          URL='http://127.0.0.1:4177/?debug=1' SHOT_DIR=qa-shots node scripts/e2e3.mjs
          URL='http://127.0.0.1:4177/?debug=1' SHOT_DIR=qa-shots node scripts/e2e-area-transitions.mjs
          URL='http://127.0.0.1:4177/?debug=1' SHOT_DIR=qa-shots node scripts/e2e-portals.mjs
      - name: Attach test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eden-qa-screenshots
          path: qa-shots/*.png
          if-no-files-found: ignore

  publish_pages:
    name: Publicar build compilado e assets
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Compilar HTML único
        run: EDEN_BUILD_ID="${GITHUB_SHA:0:8}" npm run build:single
      - name: Publicar HTML e GLB no branch main
        run: |
          cp dist-single/index.html index.html
          if test -d dist-single/assets; then
            mkdir -p assets
            cp -R dist-single/assets/. assets/
          fi
          git add index.html assets/
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no build publicado."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: publicar Operacao Eden com Regina [skip ci]"
            git push origin HEAD:main
          fi
