 Tomás Amaral, infraestrutura!",ms:3546},{who:"Caio",text:"Manutenção. A equipe que sumiu há três dias. Cadê os outros?",ms:3420},{who:"Tomás",text:"Eu não sei. Me tranquei aqui quando os bichos começaram a rondar o pátio.",ms:3966},{who:"Caio",text:"Ou se escondeu do que fez. Quem mexeu nesse posto antes de tudo cair, Tomás?",ms:4092},{who:"Tomás",text:"Eu só sigo escala! Me dá vinte e cinco segundos nessa fechadura e a porta abre. Os registros estão lá dentro.",ms:4200},{who:"Caio",text:"Vinte e cinco segundos. Eu cubro. Depois você me conta tudo.",ms:3420}],_y=[{who:"Tomás",text:"Ouviu isso? Não é juvenil. É o grande. O K-1.",ms:2790},{who:"Caio",text:"Ele pulou para dentro do pátio. Fique atrás da porta e não saia por nada.",ms:3966},{who:"Tomás",text:"O portão de carga! Ele corre em linha reta — se bater dentro da baia, solta o portão em cima dele!",ms:4200},{who:"Caio",text:"Entendido. Atrair, desviar, soltar.",ms:2600}],vy=[{who:"Caio",text:"Acabou. Ele não levanta mais.",ms:2600},{who:"Tomás",text:"Na escala daquela semana tinha um serviço na torre sete. O pessoal chamava de Noite Branca.",ms:4200},{who:"Caio",text:"Que serviço?",ms:2600},{who:"Tomás",text:"Mandaram a equipe subir e não perguntar. Quando fui lançar no sistema de relatórios, ele dizia que não houve manutenção nenhuma.",ms:4200},{who:"Caio",text:"Uma manutenção que nunca aconteceu e uma ordem de retirada que não veio do resgate.",ms:4200},{who:"Nádia Reis (rádio)",text:"…Eu ouvi, Caio. Vou registrar tudo. Traga o técnico pelo portão de serviço norte.",ms:4200}],hu={ch01_intro_radio:sy,ch01_first_tracks:ry,ch01_second_roar:ay,ch01_beacon_revelation:oy,ch01_passarela:cy,ch01_recon_radio:ly,ch01_gate_open:hy,ch01_coro_tower:dy,ch02_intro_radio:uy,ch02_generator:fy,ch02_withdrawal_order:py,ch02_reis_argument:my,ch02_tomas_meet:gy,ch02_k1_arrives:_y,ch02_noite_branca:vy};class xy{constructor(e){this.hud=e,this.queue=[],this.cur=null,this.t=0,this.onLine=null}play(e){const t=hu[e];if(!t){console.war
