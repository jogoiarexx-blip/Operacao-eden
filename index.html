:"Lia",text:"Outro chamado, bem mais longe. Eles estão se respondendo. Reposicione-se.",ms:3600}],iy=[{who:"Lia",text:"A baliza voltou. …Essa autenticação é o meu certificado de auditoria. Eu o revoguei há dois anos.",ms:5200},{who:"Lia",text:"Alguém ainda usa a minha assinatura. E o SOS saiu daqui.",ms:3600},{who:"Nádia Reis (rádio)",text:"Lia, o pedido de socorro tem a sua credencial. Preciso entender o que isso significa.",ms:4200}],ny=[{who:"Lia",text:"A passarela range. Pelo desvio oeste é mais longo, mas não depende dessas tábuas.",ms:4200}],sy=[{who:"Caio Neri (rádio)",text:"Lia? Aqui é Caio Neri. Estamos cercados no posto. Não suba pelo portão norte sem sinal da minha parte.",ms:5200},{who:"Lia",text:"Caio… Eu li o seu relatório de 2041. Você registrou a divergência dos corredores.",ms:4200},{who:"Caio Neri (rádio)",text:"E aceitei arquivar. Depois a gente conversa. Abra o portão — eu cubro o resto.",ms:4400}],ry=[{who:"Lia",text:"Painel liberado. O portão está se movendo.",ms:2800}],ay=[{who:"Lia",text:"A torre CORO está tocando. Três pulsos… pausa… três pulsos. De novo. O mesmo padrão.",ms:5e3},{who:"Caio Neri (rádio)",text:"Você também ouviu. Isso não é pane, Lia.",ms:3400},{who:"Lia",text:"Estou no portão sul. Há sinais de uma retirada às pressas do outro lado.",ms:3700},{who:"Caio Neri (rádio)",text:"Estou chegando ao Posto Norte pela estrada de serviço. Se o acesso principal estiver fechado, entro pela brecha lateral.",ms:3600}],oy=[{who:"Caio",text:"Reis, recebi o último sinal da Lia. Cheguei ao Posto Norte. O portão principal está trancado por dentro.",ms:4600},{who:"Caio",text:"Sinalizadores vermelhos no chão. Alguém marcou o caminho e não voltou para apagar.",ms:4200},{who:"Nádia Reis (rádio)",text:"Seu sinal está fraco, Caio. Sem energia no posto, o rádio de lá também está morto. Religue o gerador e eu tento fechar o canal.",ms:4200},{who:"Caio",text:"Tem uma brecha no muro lateral. Vou entrar por ela.",ms:3042},{who:"Nádia Reis (rádio)",text:"A e ?",ms:3420},{who:"Tomás",text:"Eu não sei. Me tranquei aqui quando os bichos começaram a rondar o pátio.",ms:3966},{who:"Caio",text:"Ou se escondeu do que fez. Quem mexeu nesse posto antes de tudo cair, Tomás?",ms:4092},{who:"Tomás",text:"Eu só sigo escala! Me dá vinte e cinco segundos nessa fechadura e a porta abre. Os registros estão lá dentro.",ms:4200},{who:"Caio",text:"Vinte e cinco segundos. Eu cubro. Depois você me conta tudo.",ms:3420}],uy=[{who:"Tomás",text:"Ouviu isso? Não é juvenil. É o grande. O K-1.",ms:2790},{who:"Caio",text:"Ele pulou para dentro do pátio. Fique atrás da porta e não saia por nada.",ms:3966},{who:"Tomás",text:"O portão de carga! Ele corre em linha reta — se bater dentro da baia, solta o portão em cima dele!",ms:4200},{who:"Caio",text:"Entendido. Atrair, desviar, soltar.",ms:2600}],fy=[{who:"Caio",text:"Acabou. Ele não levanta mais.",ms:2600},{who:"Tomás",text:"Na escala daquela semana tinha um serviço na torre sete. O pessoal chamava de Noite Branca.",ms:4200},{who:"Caio",text:"Que serviço?",ms:2600},{who:"Tomás",text:"Mandaram a equipe subir e não perguntar. Quando fui lançar no sistema de relatórios, ele dizia que não houve manutenção nenhuma.",ms:4200},{who:"Caio",text:"Uma manutenção que nunca aconteceu e uma ordem de retirada que não veio do resgate.",ms:4200},{who:"Nádia Reis (rádio)",text:"…Eu ouvi, Caio. Vou registrar tudo. Traga o técnico pelo portão de serviço norte.",ms:4200}],au={ch01_intro_radio:Qx,ch01_first_tracks:ey,ch01_second_roar:ty,ch01_beacon_revelation:iy,ch01_passarela:ny,ch01_recon_radio:sy,ch01_gate_open:ry,ch01_coro_tower:ay,ch02_intro_radio:oy,ch02_generator:cy,ch02_withdrawal_order:ly,ch02_reis_argument:hy,ch02_tomas_meet:dy,ch02_k1_arrives:uy,ch02_noite_branca:fy};class py{constructor(e){this.hud=e,this.queue=[],this.cur=null,this.t=0,this.onLine=null}play(e){const t=au[e];if(!t){console.warn("diálogo inexistente",e);return}this.queue.push(...t.map(i=>({...i,id:e})))}clear(){this.queue.length=0,this.cur=nul
