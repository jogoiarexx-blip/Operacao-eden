ground:#ffffff24;border-radius:3px;overflow:hidden}#prompt .prog i{display:block;height:100%;background:var(--cyan)}#toasts{position:absolute;top:74px;left:50%;transform:translate(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;width:min(640px,92vw)}.toast{background:#050e0ed1;border:1px solid var(--line);border-radius:8px;padding:8px 16px;text-align:center;animation:toast 5.2s ease forwards}.toast.good{border-color:#52e08a99}.toast.warn{border-color:#ffb34799}@keyframes toast{0%{opacity:0;transform:translateY(-6px)}6%{opacity:1;transform:none}88%{opacity:1}to{opacity:0}}#subs{position:absolute;left:50%;bottom:110px;transform:translate(-50%);width:min(780px,92vw);text-align:center}#subs .line{display:inline-block;background:#000000b3;padding:6px 14px;border-radius:6px;line-height:1.35}#subs .who{color:var(--amber);font-weight:700;margin-right:8px}body[data-subs=small] #subs{font-size:.9rem}body[data-subs=large] #subs{font-size:1.35rem}#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(190,0,0,.75));opacity:0;transition:opacity .35s}#bleed{position:absolute;bottom:14px;left:var(--safe)}#threats{position:absolute;inset:0}.threat{position:absolute;width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:20px solid var(--red);filter:drop-shadow(0 0 4px #000);opacity:.85}body.hc .threat{border-bottom-color:#fff;outline:2px solid var(--red)}.letterbox{position:absolute;left:0;right:0;height:11vh;background:#000}.letterbox.top{top:0}.letterbox.bot{bottom:0}#skip{position:absolute;right:var(--safe);bottom:14vh}#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}#mapov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#020606d1;pointer-events:auto}#mapov canvas{border:1px solid var(--line);background:#06100f;max-width:92vw;max-height:82vh}.perf{position:absolute;top:8px;r
